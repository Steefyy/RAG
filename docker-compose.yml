services:
  # 1. Serviciul tau principal de Chat (Persoana A - Port 8000)
  llm-chat-service:
    build: .
    container_name: llm-chat-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - qdrant
    networks:
      - Rag_network
    restart: unless-stopped

  # 4. Baza de Date Vectoriala Qdrant (Port 6333)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-vector-db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - app-network
    restart: unless-stopped

volumes:
  qdrant_storage:

networks:
  app-network:
    driver: bridge
